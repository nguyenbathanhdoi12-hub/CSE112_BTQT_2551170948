<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài 12 - In lịch</title>
<link rel="stylesheet" href="12_2.css">
</head>
<body>

<div class="khung">
  <!-- Ô lịch -->
  <div id="oLich">
    <div id="nam"></div>
    <div id="thang"></div>
    <div id="ngay"></div>
    <div id="thu"></div>
  </div>

  <!-- Lời chào theo buổi -->
  <div id="loiChao"></div>

  <!-- Form nhập: 3 ô + 1 nút -->
  <div id="form">
    <div>
      <label for="inNgay">Ngày</label>
      <input type="number" id="inNgay" min="1" max="31">
    </div>
    <div>
      <label for="inThang">Tháng</label>
      <input type="number" id="inThang" min="1" max="12">
    </div>
    <div>
      <label for="inNam">Năm</label>
      <input type="number" id="inNam" min="1">
    </div>
    <button id="btnIn" type="button">In lịch</button>
  </div>
</div>

<script src="12_3.js"></script>
</body>
</html>
