<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ với chúng tôi</title>
    <link rel="stylesheet" href="10_1.css">
</head>
<body>
    <header>
        <h2>Liên hệ với chúng tôi</h2>
        <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
    </header>

    <form class="khung" action="#" method="post">
        <div class="dong">
            <div class="cot">
                <label for="hoten">Họ và tên</label>
                <input type="text" id="hoten" name="hoten" required>
            </div>
            <div class="cot">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
        </div>

        <div class="dong">
            <div class="cot">
                <label for="sdt">Số điện thoại</label>
                <input type="tel" id="sdt" name="sdt" required>
            </div>
            <div class="cot">
                <label for="chude">Chủ đề</label>
                <select id="chude" name="chude" required>
                    <option selected>Hỏi về khoá học</option>
                    <option>Hỗ trợ kỹ thuật</option>
                    <option>Góp ý</option>
                    <option>Khác</option>
                </select>
            </div>
        </div>

        <div class="dong_nd">
            <label for="noidung">Nội dung</label>
            <textarea id="noidung" name="noidung" rows="4" required></textarea>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="dongy" name="dongy" checked required>
            <label for="dongy">Tôi đồng ý nhận email phản hồi.</label>
        </div>

        <div class="nut">
            <button type="submit" class="gui">Gửi liên hệ</button>
            <button type="reset" class="nhaplai">Nhập lại</button>
        </div>
    </form>
</body>
</html>
