<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 17 — Kiểm tra biểu mẫu bằng JavaScript</title>
    <link rel="stylesheet" href="17_2.css">
</head>
<body>
    <div class="khung">
        <div class="tieude">
            <h1>Đăng ký tài khoản</h1>
            <p>Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>
        </div>
        <div class="noidung">
            <div class="hoten">
                <label for="ten">Họ và tên</label>
                <input type="tex" id="ten" placeholder="Nhập họ tên ...">
                <small class="thongbao"></small>
            </div>
            <div class="email">
                <label for="thu">Email</label>
                <input type="text" id="thu" placeholder="Nhập email ...">
                <small class="thongbao"></small>
            </div>
            <div class="mk">
                <label for="matkhau">Mật khẩu</label>
                <input type="password" id="matkhau" placeholder="Nhập khẩu ...">
                <small class="thongbao"></small>
            </div>
            <div class="xacnhan_mk">
                <label for="nhaplai_mk">Xác nhận mật khẩu</label>
                <input type="password" id="nhaplai_mk" placeholder="Nhập lại mk ...">
                <small class="thongbao"></small>
            </div>
        </div>

        <div class="nut_dangky">
            <button type="submit">Đăng ký</button>
        </div>
    </div>
    <script src="17_3.js"></script>
</body>
</html>
