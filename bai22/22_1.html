<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chế đọ Sáng/Tối</title>
    <link rel="stylesheet" href="22_2.css">
</head>
<body>
    <header>
        <h1>Chế độ Tối/Sáng</h1>
        <button id="gat" aria-label="Đổi giao diện"></button>
    </header>
    <main>
        <article>
            <h2>Biến CSS (CSS Variables)</h2>
            <p>Toàn bộ màu sắc được khai báo trong :root và ghi đè bằng class.toi.</p>
        </article>
        <article>
            <h2>Chuyển đổi bằng JavaScript</h2>
            <p>Nút gạt thêm/bỏ class.toi trên &lt;body&gt;-mọi thành phần tự đổi màu.</p>
        </article>
        <article>
            <h2>Chuyển màu mượt</h2>
            <p>Dùng transition để màu nền và chữ chuyển dần, không bị giật.</p>
        </article>
        <p id="ghichu"></p>
    </main>
    <script src="22_3.js"></script>

</html>
